  expert_2: gpu  # Shared expert (always GPU)
  expert_3: gpu  # Shared expert (always GPU)
  expert_4: gpu
  expert_5: gpu
  expert_6: cpu
  # ... rest default to CPU

layer_1:
  expert_2: gpu
  expert_3: gpu
  expert_7: gpu
  expert_8: gpu
