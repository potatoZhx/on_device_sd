engine:
  model_path: "deepseek-ai/DeepSeek-V2-Lite"
  device_config:
    gpu_memory_limit: 24  # GB
    cpu_memory_limit: 64  # GB
    enable_mixed_precision: true
    gpu_threshold: 0.5
    gpu_devices: [0]
  
  scheduler_config:
    type: "popularity_based"
    expert_cache_size: 100
    popularity_window: 1000
    gpu_expert_ratio: 0.3
    top_k_experts: 2
  
  memory_config:
    kv_cache_strategy: "lru"
    expert_cache_strategy: "lru"
    max_kv_cache_size: 8  # GB
    max_expert_cache_size: 4  # GB
    prefer_gpu_for_kv_cache: true
  
  runtime_offload_config:
    enable_dynamic_offloading: true
    offload_threshold: 0.1
    migration_batch_size: 5
    async_migration: true
    migration_cooldown: 0.1
    runtime_window: 100
    hotness_threshold: 0.7
    coldness_threshold: 0.3
  
  profiling_config:
    enable_profiling: true
    profile_memory: true
    profile_computation: true 